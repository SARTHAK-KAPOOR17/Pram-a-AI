services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: pramana-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: pramana_ai
    volumes:
      - mongodb_data:/data/db
    networks:
      - pramana-network

  # Backend REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: pramana-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/pramana_ai
      JWT_SECRET: pramana_super_secure_jwt_development_secret_key_32chars
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - pramana-network

  # Frontend React SPA Service
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: pramana-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - pramana-network

networks:
  pramana-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
